# Render Blueprint — https://render.com/docs/blueprint-spec
# Defines the Autobus backend (Node API) and frontend (Vite static site).
#
# Two-pass deploy: create the Blueprint, then once Render assigns the service
# URLs, fill the env vars marked `sync: false` and trigger a redeploy.
services:
  # --- Backend API ---
  - type: web
    name: autobus-backend
    runtime: node
    rootDir: autobus-backend
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Auto-generated strong secret for signing JWTs.
      - key: JWT_SECRET
        generateValue: true
      # Secrets / URLs — set these in the Render dashboard.
      - key: MONOBANK_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Set to the frontend service URL once it exists (CORS allowlist).
      - key: FRONTEND_URL
        sync: false
      # Set to this backend's own URL — makes the monobank webhook live.
      - key: BACKEND_PUBLIC_URL
        sync: false

  # --- Frontend (Vite SPA) ---
  - type: web
    name: autobus-frontend
    runtime: static
    rootDir: autobus-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set to the backend URL + /api once the backend service exists.
      - key: VITE_API_URL
        sync: false
      # Set to this frontend's own URL (used for ticket QR codes).
      - key: VITE_PUBLIC_URL
        sync: false
    routes:
      # SPA fallback so client routes like /ticket/:code resolve.
      - type: rewrite
        source: /*
        destination: /index.html
