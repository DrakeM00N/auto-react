# Render Blueprint — https://render.com/docs/blueprint-spec
# Defines the Autobus backend (Node API) and frontend (Vite static site).
#
# Two-pass deploy: create the Blueprint, then once Render assigns the service
# URLs, fill the env vars marked `sync: false` and trigger a redeploy.
#
# IMPORTANT for the frontend: VITE_API_URL is inlined at BUILD time, not
# read at runtime. Changing it requires a redeploy with "Clear build cache".
services:
  # --- Backend API ---
  - type: web
    name: autobus-backend
    runtime: node
    rootDir: autobus-backend
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Auto-generated values — Render rolls these once and keeps them.
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYTICS_IP_SALT
        generateValue: true
      # Default-able settings.
      - key: LOG_LEVEL
        value: info
      # Secrets / URLs — set these in the Render dashboard.
      - key: MONOBANK_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # Set to the frontend service URL once it exists (CORS allowlist).
      # Comma-separated for multiple origins.
      - key: FRONTEND_URL
        sync: false
      # Set to this backend's own URL — makes the monobank webhook live.
      - key: BACKEND_PUBLIC_URL
        sync: false

  # --- Frontend (Vite SPA) ---
  - type: web
    name: autobus-frontend
    runtime: static
    rootDir: autobus-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # REQUIRED — without this, the built bundle hard-codes
      # http://localhost:3001/api and production breaks silently.
      - key: VITE_API_URL
        sync: false
      # Set to this frontend's own URL (used for ticket QR codes).
      - key: VITE_PUBLIC_URL
        sync: false
      # Must match the backend's GOOGLE_CLIENT_ID. Leave blank to hide the
      # "Continue with Google" button (the app handles the empty case).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # SPA fallback so client routes like /ticket/:code resolve.
      - type: rewrite
        source: /*
        destination: /index.html
