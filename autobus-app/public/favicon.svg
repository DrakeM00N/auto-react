<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#070707" stroke="#3DA70F" stroke-width="4"/>
  
  <!-- Bus body: simple side-view silhouette -->
  <g>
    <!-- main body -->
    <rect x="18" y="38" width="64" height="26" rx="6" fill="#3DA70F"/>
    <!-- roof slope at front -->
    <path d="M 74 38 L 82 38 Q 84 38 84 42 L 84 50 L 74 50 Z" fill="#3DA70F"/>
    <!-- windshield -->
    <path d="M 75 40 L 81 40 Q 82.5 40 82.5 42 L 82.5 48 L 75 48 Z" fill="#070707"/>
    <!-- windows -->
    <rect x="23" y="42" width="10" height="8" rx="1.5" fill="#070707"/>
    <rect x="36" y="42" width="10" height="8" rx="1.5" fill="#070707"/>
    <rect x="49" y="42" width="10" height="8" rx="1.5" fill="#070707"/>
    <rect x="62" y="42" width="9" height="8" rx="1.5" fill="#070707"/>
    <!-- wheels -->
    <circle cx="32" cy="65" r="7" fill="#070707"/>
    <circle cx="32" cy="65" r="3" fill="#3DA70F"/>
    <circle cx="68" cy="65" r="7" fill="#070707"/>
    <circle cx="68" cy="65" r="3" fill="#3DA70F"/>
    <!-- ground line/speed swoosh -->
    <path d="M 12 72 Q 50 78 88 72" stroke="#3DA70F" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
