<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#FFC93C"/>
  <!-- bus body -->
  <rect x="9" y="15" width="46" height="32" rx="6" fill="#1A1814"/>
  <!-- windshield + windows strip -->
  <rect x="13" y="20" width="38" height="11" rx="2" fill="#7CC4FF"/>
  <line x1="24" y1="20" x2="24" y2="31" stroke="#1A1814" stroke-width="1.6"/>
  <line x1="34" y1="20" x2="34" y2="31" stroke="#1A1814" stroke-width="1.6"/>
  <line x1="44" y1="20" x2="44" y2="31" stroke="#1A1814" stroke-width="1.6"/>
  <!-- door -->
  <rect x="38" y="33" width="9" height="12" rx="1.5" fill="#7CC4FF"/>
  <!-- headlight -->
  <rect x="52" y="35" width="3" height="4" rx="1" fill="#FFF7C2"/>
  <!-- wheels -->
  <circle cx="19" cy="49" r="6" fill="#1A1814" stroke="#FFC93C" stroke-width="2"/>
  <circle cx="19" cy="49" r="2.4" fill="#FFC93C"/>
  <circle cx="45" cy="49" r="6" fill="#1A1814" stroke="#FFC93C" stroke-width="2"/>
