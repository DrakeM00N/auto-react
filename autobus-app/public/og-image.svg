<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#132018"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CE05C"/>
      <stop offset="1" stop-color="#3DA70F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="240" fill="#3DA70F" opacity=".10"/>

  <!-- Card -->
  <rect x="80" y="120" width="1040" height="390" rx="32" fill="#0F1710" stroke="#3DA70F" stroke-width="3"/>

  <!-- Brand name: Bus (green) To (white) RIA (green) -->
  <text x="130" y="245" font-family="Arial, sans-serif" font-size="80" font-weight="800">
    <tspan fill="#3DA70F">Bus</tspan><tspan fill="#F5F5F0">To</tspan><tspan fill="#3DA70F">RIA</tspan>
  </text>

  <text x="130" y="315" fill="#F0EDE6" font-family="Arial, sans-serif" font-size="40">Автобусні квитки онлайн</text>
  <text x="130" y="365" fill="#9CA3B0" font-family="Arial, sans-serif" font-size="27">Подорожуйте Україною зручно</text>

  <!-- Bus illustration, compact coach silhouette -->
  <g transform="translate(130, 400)">
    <!-- shadow under wheels -->
    <ellipse cx="280" cy="94" rx="300" ry="10" fill="#000000" opacity=".35"/>

    <!-- rear -->
    <rect x="0" y="10" width="18" height="65" rx="9" fill="url(#busBody)"/>

    <!-- main body -->
    <rect x="10" y="10" width="500" height="65" rx="14" fill="url(#busBody)"/>
    <!-- roofline taper at the front (right side) -->
    <path d="M 470 10 L 502 10 Q 512 10 512 20 L 512 45 L 470 45 Z" fill="url(#busBody)"/>

    <!-- windshield -->
    <path d="M 476 16 L 498 16 Q 505 16 505 21 L 505 40 L 476 40 Z" fill="#0F1710"/>

    <!-- side windows -->
    <rect x="30" y="20" width="52" height="24" rx="4" fill="#0F1710"/>
    <rect x="97" y="20" width="52" height="24" rx="4" fill="#0F1710"/>
    <rect x="164" y="20" width="52" height="24" rx="4" fill="#0F1710"/>
    <rect x="231" y="20" width="52" height="24" rx="4" fill="#0F1710"/>
    <rect x="298" y="20" width="52" height="24" rx="4" fill="#0F1710"/>
    <rect x="365" y="20" width="52" height="24" rx="4" fill="#0F1710"/>
    <rect x="432" y="20" width="30" height="24" rx="4" fill="#0F1710"/>

    <!-- headlight -->
    <circle cx="490" cy="60" r="6" fill="#F5F5F0"/>

    <!-- wheels -->
    <circle cx="110" cy="90" r="26" fill="#0F1710"/>
    <circle cx="110" cy="90" r="11" fill="#3DA70F"/>
    <circle cx="400" cy="90" r="26" fill="#0F1710"/>
    <circle cx="400" cy="90" r="11" fill="#3DA70F"/>

    <!-- speed lines -->
    <path d="M -50 55 L -8 55" stroke="#3DA70F" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <path d="M -68 70 L -16 70" stroke="#3DA70F" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
